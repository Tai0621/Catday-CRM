<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #F2EDE0; color: #2D1907; }
    a { color: #B14919; } a:hover { color: #8d3a14; }
    .tap { cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 800px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 14px">

  <div>
    <div style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: rgba(45,25,7,.45)">Boarding</div>
    <h1 style="margin: 3px 0 0; font-size: 21px; font-weight: 700">Wednesday 19 Aug</h1>
    <div style="font-size: 12.5px; color: rgba(45,25,7,.55); margin-top: 3px">24 rooms in use &middot; 5 out today &middot; 11 tasks left</div>
  </div>

  <!-- zone tabs: one bank at a time, full width -->
  <div style="display: flex; gap: 6px">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <div class="tap" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</div>
    </sc-for>
  </div>

  <div style="font-size: 12px; color: rgba(45,25,7,.5)">{{zoneName}}</div>

  <!-- the zone -->
  <div style="{{gridStyle}}">
    <sc-for list="{{rooms}}" as="r" hint-placeholder-count="9">
      <div class="tap" style="{{r.cellStyle}}">
        <div style="{{r.ventStyle}}"></div>
        <div style="{{r.glassStyle}}">
          <div style="{{r.archStyle}}"></div>
          <div style="{{r.shelfStyle}}"></div>
          <div style="{{r.trayStyle}}"></div>
          <div style="position: relative; z-index: 2; height: 100%; box-sizing: border-box; padding: 5px 6px; display: flex; flex-direction: column; gap: 3px">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 4px">
              <span style="font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: .03em; opacity: .5">{{r.code}}</span>
              <sc-if value="{{r.badge}}" hint-placeholder-val="{{true}}">
                <span style="{{r.badgeStyle}}">{{r.badge}}</span>
              </sc-if>
            </div>
            <span style="{{r.nameStyle}}">{{r.occupant}}</span>
            <sc-if value="{{r.hasBar}}" hint-placeholder-val="{{true}}">
              <div style="height: 3px; border-radius: 999px; background: rgba(45,25,7,.16); overflow: hidden">
                <div style="{{r.barStyle}}"></div>
              </div>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

  <!-- what is left today, because a phone is used mid-round -->
  <div style="background: #ECDBB6; border: 1px solid rgba(45,25,7,.12); border-radius: 12px; padding: 13px 15px">
    <div style="font-size: 10px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: rgba(45,25,7,.6); margin-bottom: 9px">Still to do here</div>
    <div style="display: flex; flex-direction: column; gap: 9px">
      <sc-for list="{{todo}}" as="t" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px; min-height: 44px">
          <span style="width: 20px; height: 20px; border-radius: 6px; border: 1.6px solid rgba(45,25,7,.3); flex-shrink: 0"></span>
          <div>
            <div style="font-size: 13.5px; font-weight: 500">{{t.what}}</div>
            <div style="font-size: 11.5px; color: rgba(45,25,7,.5)">{{t.who}}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="font-size: 11px; color: rgba(45,25,7,.4); text-align: center; line-height: 1.5">
    Tiles are 44&thinsp;pt minimum &mdash; this is used one-handed, standing up, next to the cabinet.
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":830}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { zone: 2 }
  }

  renderVals() {
    // Same cabinet vocabulary as the desktop wall: cream carcass, slat vent,
    // and only the glass carrying the state.
    const CARCASS = '#F3EBD0'
    const OUTLINE = 'rgba(45,25,7,.72)'
    const HAIR = 'rgba(45,25,7,.34)'
    const TRAY = 'rgba(150,168,120,.5)'
    const slats = 'repeating-linear-gradient(90deg, ' + HAIR + ' 0 1px, transparent 1px 4px)'
    const S = {
      Occupied:    { glass: 'rgba(177,73,25,.30)',   edge: 'rgba(177,73,25,.6)',   fg: '#5e2710' },
      Available:   { glass: 'rgba(114,144,148,.20)', edge: 'rgba(114,144,148,.5)', fg: 'rgba(45,25,7,.45)' },
      Cleaning:    { glass: 'rgba(231,206,122,.55)', edge: 'rgba(184,144,43,.6)',  fg: '#6b5000' },
      Maintenance: { glass: 'rgba(45,25,7,.12)',     edge: 'rgba(45,25,7,.3)',     fg: 'rgba(45,25,7,.38)' },
    }
    const B = {
      Health: { bg: '#B14919', fg: '#ECDBB6' },
      Out:    { bg: '#B8902B', fg: '#2D1907' },
      Late:   { bg: 'rgba(177,73,25,.85)', fg: '#ECDBB6' },
      In:     { bg: 'rgba(45,25,7,.35)', fg: '#ECDBB6' },
    }

    const zoneDefs = [
      { label: 'Z1', name: 'Feature wall · showing 6 of 10', cols: 2, rooms: [
        ['Z1-01', 'Occupied', 'Mochi', 'Health'], ['Z1-02', 'Occupied', 'Biscuit', null],
        ['Z1-03', 'Available', '', null], ['Z1-04', 'Occupied', 'Tofu', 'Out'],
        ['Z1-05', 'Occupied', 'Pepper', null], ['Z1-06', 'Cleaning', '', null],
      ] },
      { label: 'Z2', name: 'Porthole bank · all 9', cols: 3, rooms: [
        ['Z2-01', 'Occupied', 'Latte', null], ['Z2-02', 'Occupied', 'Ollie', null], ['Z2-03', 'Available', '', null],
        ['Z2-04', 'Occupied', 'Momo', 'Out'], ['Z2-05', 'Available', '', null], ['Z2-06', 'Maintenance', '', null],
        ['Z2-07', 'Occupied', 'Pudding', null], ['Z2-08', 'Available', '', null], ['Z2-09', 'Occupied', 'Yuzu', null],
      ] },
      { label: 'Z3', name: 'Standard bank · showing 9 of 18', cols: 3, rooms: [
        ['Z3-01', 'Occupied', 'Kopi', null], ['Z3-02', 'Available', '', null], ['Z3-03', 'Occupied', 'Ginger', null],
        ['Z3-04', 'Occupied', 'Snow', null], ['Z3-05', 'Available', '', null], ['Z3-06', 'Cleaning', '', null],
        ['Z3-07', 'Occupied', 'Peanut', null], ['Z3-08', 'Occupied', 'Cendol', 'Health'], ['Z3-09', 'Available', '', null],
      ] },
      { label: 'Z4', name: 'Suites · all 4', cols: 2, rooms: [
        ['Z4-01', 'Occupied', 'Raja & Ratu', null], ['Z4-02', 'Available', '', null],
        ['Z4-03', 'Occupied', 'Bunga', 'Out'], ['Z4-04', 'Available', '', null],
      ] },
      { label: 'Stage', name: 'Staging cabinet · all 6', cols: 3, rooms: [
        ['S-01', 'Occupied', 'Chestnut', 'In'], ['S-02', 'Available', '', null], ['S-03', 'Available', '', null],
        ['S-04', 'Occupied', 'Barley', 'Out'], ['S-05', 'Available', '', null], ['S-06', 'Available', '', null],
      ] },
    ]

    const tabs = zoneDefs.map((z, i) => {
      const on = this.state.zone === i
      return {
        label: z.label,
        pick: () => this.setState({ zone: i }),
        style: [
          'flex-grow: 1', 'text-align: center', 'min-height: 44px', 'display: flex',
          'align-items: center', 'justify-content: center', 'border-radius: 10px',
          'font-size: 13px', 'font-weight: 600',
          'background: ' + (on ? '#B14919' : 'rgba(45,25,7,.06)'),
          'color: ' + (on ? '#ECDBB6' : 'rgba(45,25,7,.6)'),
        ].join('; '),
      }
    })

    const z = zoneDefs[this.state.zone]
    const rooms = z.rooms.map((r, i) => {
      const [code, status, occupant, badge] = r
      const pct = status === 'Occupied' ? [100, 60, 80, 35, 100, 45][i % 6] : 0
      return {
        code, occupant, badge, hasBar: status === 'Occupied',
        cellStyle: [
          'min-height: 88px', 'box-sizing: border-box', 'border-radius: 7px', 'padding: 4.5px',
          'display: flex', 'flex-direction: column', 'gap: 3px',
          'background: ' + CARCASS,
          'border: 1.5px solid ' + OUTLINE,
          'box-shadow: inset 0 0 0 1px rgba(255,255,255,.55)',
        ].join('; '),
        ventStyle: 'height: 10px; flex-shrink: 0; border-radius: 999px; border: 1px solid ' + HAIR + '; background: ' + slats,
        glassStyle: 'position: relative; flex-grow: 1; overflow: hidden; border-radius: 5px; background: ' + S[status].glass + '; border: 1px solid ' + S[status].edge + '; color: ' + S[status].fg,
        archStyle: 'position: absolute; right: 7%; top: 5%; width: 33%; height: 50%; border-radius: 50% 50% 0 0; background: rgba(45,25,7,.13)',
        shelfStyle: 'position: absolute; left: 7%; right: 7%; top: 53%; height: 2px; border-radius: 2px; background: rgba(45,25,7,.2)',
        trayStyle: 'position: absolute; left: 9%; right: 24%; bottom: 5%; height: 21%; background: ' + TRAY + '; border: 1px solid rgba(45,25,7,.18); clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%); border-radius: 2px',
        nameStyle: 'flex-grow: 1; display: flex; align-items: center; font-size: 14px; font-weight: 700; line-height: 1.1; text-shadow: 0 1px 2px rgba(243,235,208,.9)',
        badgeStyle: badge
          ? 'font-size: 8.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; background: ' + B[badge].bg + '; color: ' + B[badge].fg
          : '',
        barStyle: 'height: 100%; border-radius: 999px; width: ' + pct + '%; background: ' + (pct >= 100 ? 'rgba(122,138,79,.9)' : '#B14919'),
      }
    })

    const todo = [
      { what: 'Play & brush — Cendol, Z3-08', who: 'nobody assigned' },
      { what: 'Evening feed — every cat in this bank', who: 'due from 17:30' },
      { what: 'Full litter change — Z3-03', who: 'weekly, due today' },
    ]

    return {
      tabs, rooms, todo,
      zoneName: z.name,
      gridStyle: 'display: grid; grid-template-columns: repeat(' + z.cols + ', minmax(0, 1fr)); gap: 8px',
    }
  }
}
</script>
</body>
</html>
